<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Landing</title>
    <style>
      :root {
        --bg: #f6efe4;
        --surface: rgba(255, 252, 246, 0.82);
        --text: #1e1b18;
        --muted: #675f56;
        --accent: #da5a2a;
        --accent-strong: #af3810;
        --line: rgba(30, 27, 24, 0.08);
        --shadow: 0 24px 60px rgba(76, 40, 18, 0.12);
        --radius: 24px;
        --radius-sm: 14px;
        --space-1: 8px;
        --space-2: 16px;
        --space-3: 24px;
        --space-4: 40px;
        --space-5: 64px;
        --max-width: 1040px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Apple SD Gothic Neo", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(218, 90, 42, 0.18), transparent 30%),
          radial-gradient(circle at bottom right, rgba(255, 187, 92, 0.22), transparent 34%),
          var(--bg);
      }

      a {
        color: inherit;
      }

      .page {
        width: min(calc(100% - 32px), var(--max-width));
        margin: 0 auto;
        padding: var(--space-5) 0;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: var(--space-5);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto -80px -120px auto;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: rgba(218, 90, 42, 0.14);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 999px;
        background: rgba(30, 27, 24, 0.06);
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 9ch;
        margin: var(--space-3) 0 var(--space-2);
        font-size: clamp(3rem, 7vw, 5.8rem);
        line-height: 0.94;
        letter-spacing: -0.06em;
      }

      .lead {
        max-width: 540px;
        margin: 0 0 var(--space-4);
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        margin-bottom: var(--space-4);
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 152px;
        min-height: 48px;
        padding: 0 20px;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        text-decoration: none;
        font-weight: 700;
        transition: transform 140ms ease, background-color 140ms ease, border-color 140ms ease;
      }

      .button:focus-visible {
        outline: 3px solid rgba(218, 90, 42, 0.35);
        outline-offset: 3px;
      }

      .button.primary {
        background: var(--accent);
        color: #fff7f2;
      }

      .button.primary:hover {
        background: var(--accent-strong);
        transform: translateY(-1px);
      }

      .button.secondary {
        border-color: var(--line);
        background: rgba(255, 255, 255, 0.45);
      }

      .button.secondary:hover {
        background: rgba(255, 255, 255, 0.78);
        transform: translateY(-1px);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--space-2);
      }

      .stat {
        padding: var(--space-3);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.52);
        border: 1px solid var(--line);
      }

      .stat strong {
        display: block;
        margin-bottom: var(--space-1);
        font-size: 1.6rem;
        letter-spacing: -0.04em;
      }

      .stat span {
        color: var(--muted);
        line-height: 1.5;
      }

      @media (max-width: 720px) {
        .page {
          padding: var(--space-3) 0;
        }

        .hero {
          padding: var(--space-4) var(--space-3);
        }

        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="eyebrow">Small Website</div>
        <h1>작지만 바로 열리는 웹사이트</h1>
        <p class="lead">
          이 저장소에는 가장 작은 형태의 정적 랜딩 페이지를 추가했습니다. 별도 빌드 없이
          `index.html`만으로 열리며, 이후 필요한 내용이 생기면 여기서 바로 확장할 수 있습니다.
        </p>
        <div class="actions">
          <a class="button primary" href="mailto:hello@example.com">문의하기</a>
          <a class="button secondary" href="#status">현재 상태 보기</a>
        </div>
        <div class="stats" id="status">
          <article class="stat">
            <strong>1 file</strong>
            <span>정적 HTML 한 파일로 끝나는 최소 결과물</span>
          </article>
          <article class="stat">
            <strong>No build</strong>
            <span>프레임워크, 설치, 번들링 없이 바로 실행 가능</span>
          </article>
          <article class="stat">
            <strong>Responsive</strong>
            <span>모바일과 데스크톱에서 모두 읽히는 레이아웃</span>
          </article>
        </div>
      </section>
    </main>
  </body>
  </html>
