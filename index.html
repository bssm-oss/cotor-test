<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>test | 첫 웹사이트</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f2ea;
        --panel: rgba(255, 255, 255, 0.82);
        --text: #1f1a17;
        --muted: #6c625b;
        --accent: #b4552d;
        --accent-strong: #8f3d1b;
        --border: rgba(31, 26, 23, 0.1);
        --shadow: 0 20px 60px rgba(77, 52, 37, 0.14);
        --radius: 24px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua",
          Palatino, serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(180, 85, 45, 0.16), transparent 32%),
          radial-gradient(circle at bottom right, rgba(143, 61, 27, 0.12), transparent 28%),
          linear-gradient(180deg, #fcfaf5 0%, var(--bg) 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(720px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 48px;
        backdrop-filter: blur(12px);
      }

      .eyebrow {
        margin: 0 0 16px;
        font-size: 0.85rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent-strong);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 7vw, 4.5rem);
        line-height: 0.94;
      }

      p {
        margin: 20px 0 0;
        max-width: 34rem;
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 32px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 144px;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 160ms ease, background-color 160ms ease,
          color 160ms ease, border-color 160ms ease;
      }

      a:focus-visible {
        outline: 3px solid rgba(180, 85, 45, 0.35);
        outline-offset: 3px;
      }

      .primary {
        color: #fff8f2;
        background: var(--accent);
      }

      .primary:hover {
        background: var(--accent-strong);
        transform: translateY(-1px);
      }

      .secondary {
        color: var(--text);
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.75);
      }

      .secondary:hover {
        border-color: rgba(31, 26, 23, 0.2);
        transform: translateY(-1px);
      }

      .note {
        margin-top: 28px;
        font-size: 0.95rem;
      }

      @media (max-width: 640px) {
        main {
          padding: 32px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Test Company</p>
      <h1>아무 웹사이트나 하나, 바로 열리는 형태로 만들었습니다.</h1>
      <p>
        이 저장소가 비어 있어 가장 작은 완성형 결과물로 정적 단일 페이지를 추가했습니다.
        별도 빌드 없이 <code>index.html</code>만 열면 바로 화면이 나옵니다.
      </p>
      <div class="actions">
        <a class="primary" href="./index.html">페이지 열기</a>
        <a class="secondary" href="https://example.com">예시 링크</a>
      </div>
      <p class="note">
        다음 개선으로는 이 정적 페이지를 설명하는 간단한 <code>README.md</code>를 추가해
        실행 방법과 목적을 문서화하는 것이 가장 효율적입니다.
      </p>
    </main>
  </body>
</html>
