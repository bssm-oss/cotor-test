<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Landing</title>
    <style>
      :root {
        --bg: #f7f1e8;
        --surface: rgba(255, 252, 246, 0.84);
        --text: #1f2933;
        --muted: #52606d;
        --accent: #c05a2b;
        --accent-strong: #9f4319;
        --border: rgba(31, 41, 51, 0.12);
        --shadow: 0 24px 60px rgba(31, 41, 51, 0.12);
        --radius: 24px;
        --radius-sm: 14px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --space-8: 32px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Iowan Old Style", "Palatino Linotype", serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.9), transparent 35%),
          linear-gradient(135deg, #f3ebdd 0%, #f8f4ee 50%, #efe4d0 100%);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: var(--space-8);
      }

      .card {
        width: min(100%, 760px);
        padding: clamp(28px, 5vw, 56px);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 var(--space-4);
        border-radius: 999px;
        background: rgba(192, 90, 43, 0.12);
        color: var(--accent-strong);
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: var(--space-6) 0 var(--space-4);
        font-size: clamp(2.4rem, 7vw, 4.8rem);
        line-height: 0.95;
      }

      p {
        margin: 0;
        max-width: 48ch;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
        margin-top: var(--space-8);
      }

      a,
      button {
        min-width: 160px;
        min-height: 44px;
        padding: 0 var(--space-6);
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        font: inherit;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        transition: transform 140ms ease, background-color 140ms ease, border-color 140ms ease;
      }

      .primary {
        background: var(--accent);
        color: #fffaf5;
      }

      .secondary {
        background: transparent;
        color: var(--text);
        border-color: var(--border);
      }

      a:hover,
      button:hover {
        transform: translateY(-1px);
      }

      a:focus-visible,
      button:focus-visible {
        outline: 3px solid rgba(192, 90, 43, 0.35);
        outline-offset: 3px;
      }

      .note {
        margin-top: var(--space-6);
        font-size: 0.95rem;
      }

      @media (max-width: 640px) {
        main {
          padding: var(--space-4);
        }

        .actions {
          flex-direction: column;
        }

        a,
        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <span class="eyebrow">Small Web Demo</span>
        <h1>한 장짜리 테스트 웹사이트</h1>
        <p>
          비어 있던 저장소에 바로 열어볼 수 있는 정적 페이지를 추가했습니다.
          별도 빌드 없이 `index.html`만 열면 되고, 간단한 CTA와 반응형 레이아웃까지 포함합니다.
        </p>
        <div class="actions">
          <a class="primary" href="mailto:test@example.com">문의하기</a>
          <button class="secondary" type="button" id="message-trigger">한마디 보기</button>
        </div>
        <p class="note" id="message">준비됨</p>
      </section>
    </main>
    <script>
      const trigger = document.getElementById("message-trigger");
      const message = document.getElementById("message");

      trigger.addEventListener("click", () => {
        message.textContent = "작지만 바로 열리는 웹사이트가 준비되었습니다.";
      });
    </script>
  </body>
</html>
